name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: true

      # Read the Node version CIPP declares in package.json (engines.node).
      # Upstream bumps this frequently (^22.13.0 -> ^22.22.2 between 10.8.0 and
      # 10.8.1), so never hardcode it here.
      - name: Get Node version
        id: get_node_version
        run: |
          node_raw_version=$(node -p "require('./package.json').engines.node")
          node_sanitized_version=$(echo $node_raw_version | sed -E 's/[^0-9.]+//g')
          echo "node_version=$node_sanitized_version" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ steps.get_node_version.outputs.node_version }}

      # Project uses yarn (yarn.lock present, no package-lock.json)
      - name: Install Dependencies
        run: yarn install

      # Next 16 builds are memory-hungry; raise the heap ceiling
      - name: Build Project
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Stamp version.json with the commit hash so Application Settings
      # reports the build accurately
      - name: Update version.json
        run: |
          VERSION=$(jq -r '.version' public/version.json)
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "{\"version\": \"${VERSION}\", \"commit\": \"${SHORT_SHA}\"}" > out/version.json

      # With skip_app_build, SWA reads routing/auth config from the upload
      # folder rather than the repo root
      - name: Stage Static Web App config
        run: cp staticwebapp.config.json out/

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_SEA_03B81E50F }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/out"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_AMBITIOUS_SEA_03B81E50F }}
          action: "close"
